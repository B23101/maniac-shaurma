# ═══════════════════════════════════════════════════════════════════════
#  ЕВАКУАЦІЯ
# ═══════════════════════════════════════════════════════════════════════
#  Після генераторів: ПКМ по приймачу → «Викликати вертоліт» → знайти
#  сигнальну ракету → запустити її на галявині → вертоліт летить,
#  спускає мотузку → ПКМ по мотузці → автоматичне лазіння.
#  Розмітка (приймачі, галявини) — командами /maniac point add receiver
#  та /maniac clearing ..., тут лише числа. Час у секундах, відстані в блоках.
# ═══════════════════════════════════════════════════════════════════════

# ── Приймач ─────────────────────────────────────────────────────────────
# Макс. відстань, з якої ПКМ відкриває меню приймача (1…16).
receiverUseDistanceBlocks: 4.0
# Мін. відстань від обраного приймача до старту маньяка (0…1024).
receiverMinManiacBlocks: 50

# ── Сигнальна ракета ────────────────────────────────────────────────────
# Скільки ракет гарантовано лежить на карті на старті (1…8).
flareCount: 2
# Якщо ракет не лишилось ніде — через стільки с біля приймача з'явиться нова (0 — вимкнено).
flareWatchdogSeconds: 20
# Скільки с палає ракета (5…300). Партикли видно здалеку — це ризик.
flareBurnSeconds: 30

# ── Вертоліт ────────────────────────────────────────────────────────────
# Затримка між запуском ракети й початком польоту (0…300 с). За цей час сервер
# підвантажує коридор польоту й зчитує висоти блоків. Далі вертоліт летить зі своєю
# швидкістю: повний час = затримка + відстань появи / швидкість.
heliDispatchDelaySeconds: 15
# Як далеко від точки зависання він з'являється й звідки летить (100…1500 блоків).
# Напрям — у бік /maniac heli entry, а без неї — найвільніший із 8 напрямків.
heliSpawnDistanceBlocks: 400
# Запас висоти над найвищим блоком у польоті (5…100). Вертоліт повторює рельєф
# (дерева, будівлі) і біля галявини плавно знижується до меншого запасу.
heliCruiseClearanceBlocks: 25
# Швидкість польоту, блоків/с (4…120). Біля точки він плавно гальмує.
heliSpeedBlocksPerSecond: 28.0
# Швидкість вертикальних маневрів, блоків/с (1…30): набір висоти над перешкодою
# (= це / швидкість польоту) і короткий вертикальний доспуск над галявиною, якщо
# поруч високі дерева. Зниження до галявини за перешкодою йде крутіше (до ~24°).
heliDescendBlocksPerSecond: 6.0

# ── Мотузка й лазіння ───────────────────────────────────────────────────
# Довжина мотузки = висота висіння над землею (6…40).
ropeLengthBlocks: 14
# За скільки с мотузка розмотується (0.5…20); стільки ж вона підтягується при відльоті.
# Лізти можна лише коли вона розмотана повністю; при підтягуванні — вже не можна.
ropeDropSeconds: 3.0
# Швидкість лазіння, блоків/с (0.3…8).
climbBlocksPerSecond: 1.6
# Пауза лазіння після удару, який НЕ збив гравця (0…100 тіків). 0 — лізе далі.
climbHitStaggerTicks: 0
# Скільки с вертоліт висить зі спущеною мотузкою (10…600).
heliStaySeconds: 90
# Скільки с чекає тих, хто вже лізе, коли час вийшов (0…120). 0 — вертоліт відлітає рівно по таймеру, хто на мотузці — падає.
departGraceSeconds: 0

# ── Оголошення ──────────────────────────────────────────────────────────
# Чи чує маньяк «вертоліт викликано», «ракету запущено», «мотузку спущено».
announceToManiac: true
