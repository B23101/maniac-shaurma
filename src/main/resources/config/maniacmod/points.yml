# ═══════════════════════════════════════════════════════════════════════
#  КАРТА, ЛУТ І ТОЧКИ
# ═══════════════════════════════════════════════════════════════════════
#  Нижче (після розділу «ТОЧКИ») — розмітка, яку наповнюють команди
#  /maniac point ... Не редагуйте її без потреби.
# ═══════════════════════════════════════════════════════════════════════

# ── Карта й розкидання гравців ──────────────────────────────────────────
map:
  # Розмір карти, блоків (64…2048).
  sizeBlocks: 300
  # Мін. відстань від виживого до маньяка на старті (0…1024).
  minSurvivorToManiacBlocks: 60
  # Мін. відстань між двома виживими на старті (0…1024).
  minSurvivorToPeerBlocks: 20
  # Яку частку точок предметів задіяти (0…1).
  itemPointEngageRatio: 0.6
  # Якщо розмітка не дозволяє дотриматись відстаней, вони послаблюються
  # покроково: кожен крок множить відстань на relaxationStep (0.1…0.99),
  # але не більше maxRelaxationPasses разів (0…32).
  relaxationStep: 0.85
  maxRelaxationPasses: 6

# ── Предмети на землі ───────────────────────────────────────────────────
loot:
  # З якої відстані можна підібрати предмет (0.5…6 блоків).
  pickupRangeBlocks: 2.0
  # Скільки тіків щойно кинутий (Q) предмет не підібрати назад (0…200).
  dropPickupDelayTicks: 20
  # Білі блискітки навколо предмета на землі.
  sparkleEnabled: true

# ═══════════════════════════════════════════════════════════════════════
#  ТОЧКИ (координати — не змінювати вручну)
# ═══════════════════════════════════════════════════════════════════════
lobby:
  x: 0.0
  y: 64.0
  z: 0.0
  yaw: 0.0
survivorSpawns: []
maniacSpawns: []
itemPoints: []
generatorPoints: []
exitPoints: []
receiverPoints: []
