# ═══════════════════════════════════════════════════════════════════════
#  ГАКИ
# ═══════════════════════════════════════════════════════════════════════
#  Лежить → маньяк ПКМ бере на плече → ПКМ по вільному гаку вішає → 60 с до смерті.
#  Союзники знімають, утримуючи ПКМ ~8 с (survivors.rescueTicks): жертва падає перед гаком
#  з reviveHp хп. Розмітка гаків — /maniac point add hook (дивись, КУДИ має «дивитись» гак).
#  Положення жертви підганяється ЦИМ файлом і підхоплюється на льоту (раз на секунду).
#  Для тесту без матчу: /maniac hook spawn, потім /maniac hook hang <гравець>.
# ═══════════════════════════════════════════════════════════════════════

# Скільки секунд жертва висить до смерті (5…600).
hangSeconds: 60
# Поки маньяк ближче за стільки блоків до жертви — таймер стоїть (0…64; 0 — без паузи).
maniacPauseRadiusBlocks: 10
# Чи вмирає той, хто просто лежить (не несуть, не висить), за survivors.downedBleedOutTicks.
lyingBleedsOut: false
# З якої відстані маньяк бере лежачого на плече (1…8) і вішає на гак (1…10).
pickupRangeBlocks: 3.0
hookRangeBlocks: 3.5
# Пауза (тіки) перед тим, як впущену з плеча жертву можна взяти знову (0…200).
repickupDelayTicks: 20

# ── Положення жертви НА ГАКУ ────────────────────────────────────────────
# Систему задає сам гак: «вперед» = куди він дивиться, «праворуч» = ліва/права рука, якщо стати
# за гаком і дивитись туди ж. Усе в блоках від центру основи гака.
#
# Значення підібрані ЧИСЛЕННО під позу hook_hang.json («на гачку») і geo/entity/hook.geo.json:
# вістря крюка (кістка tip: y 2.0…2.5 блока, 0.44 блока вперед від центру) входить у груди,
# а нижня перекладина (y 1.875…2.0) і стовп/ланцюг тіла НЕ зачіпають. Старі 0.55/0.85 під нову
# позу (тулуб нахилений до гака) давали перекладину наскрізь через живіт — жертва «сиділа в гачку»,
# а не висіла на крюку. Змінюєш модель гака чи позу — перерахуй/підігнай ці три числа.
hangForward: 0.70
hangSide: 0.0
# Висота НІГ жертви над основою. Груди ≈ ноги + 0.7…1.4 блока; вістря крюка — на 2.0…2.5.
hangUp: 1.05
# Куди повернуте тіло: 0 — обличчям від гака, 180 — обличчям до гака (-180…180).
# Поза «на гачку» нахиляє тулуб ВПЕРЕД і опускає голову — тому лице до гака (180): жертва повисла грудьми на крюку.
hangYawDegrees: 180.0
# На скільки блоків перед гаком ставимо знятого союзниками.
unhookFrontBlocks: 1.0

# ── Положення жертви НА ПЛЕЧІ МАНЬЯКА ───────────────────────────────────
# Висота ніг як частка зросту хітбокса маньяка (працює для низького й високого архетипу).
carryHeightFraction: 0.62
carryForward: -0.1
carrySide: 0.0
# 90 — лежить поперек плечей (як «пожежний»), 0 — вздовж тіла, -90 — на іншому плечі.
carryYawDegrees: 90.0
