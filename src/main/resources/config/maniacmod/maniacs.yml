# ═══════════════════════════════════════════════════════════════════════
#  МАНЬЯКИ, ПАСТКИ І ЗБРОЯ ВИЖИВИХ
# ═══════════════════════════════════════════════════════════════════════
#  Час: 20 тіків = 1 секунда. Відстані — у блоках.
#  Параметри окремих маньяків (швидкість, удар…) лежать у
#  maniac_stats/<id>.yml.
# ═══════════════════════════════════════════════════════════════════════

# ╔═══════════════════════════════════════════════════════════════════╗
# ║  ВИБІР МАНЬЯКА                                                    ║
# ╚═══════════════════════════════════════════════════════════════════╝
maniac_selection:
  # Хто стає маньяком: RANDOM — випадковий гравець, MANUAL — вручну.
  playerMode: RANDOM
  # Який маньяк: RANDOM — випадковий, MENU — гравець обирає в меню,
  # FIXED — завжди fixedManiacId.
  typeMode: RANDOM
  # Id маньяка для режиму FIXED. Порожньо — випадковий.
  fixedManiacId: ''
  # Скільки секунд на вибір у меню (5…300).
  selectionTimeoutSeconds: 60
  # Показувати вступну сцену маньяка.
  enableIntroScene: true

# ╔═══════════════════════════════════════════════════════════════════╗
# ║  ПАСТКИ І ЗБРОЯ                                                   ║
# ╚═══════════════════════════════════════════════════════════════════╝
maniac:

  # ── Загальне для пасток ─────────────────────────────────────────────
  # Скільки пасток маньяк бере в матч (1…3).
  trapsPerMatch: 3
  # Дальність прицілу при розміщенні пастки (2…16 блоків).
  trapPlaceRangeBlocks: 6.0
  # Перезарядка розміщення для пасток без власної (20…6000 тіків).
  trapPlaceCooldownTicks: 500
  # Дальність Geo-ножиць, якими перерізають дріт і мотузку (1…8).
  geoScissorsRangeBlocks: 3.5

  # ── Капкан ──────────────────────────────────────────────────────────
  # Перезарядка після встановлення (20…12000). 800 = 40 с.
  bearTrapPlaceCooldownTicks: 800
  # Шкода жертві при захлопненні, хп (0…100).
  bearTrapDamage: 15
  # Скільки прихованої міцності ніг знімає капкан (0…100).
  bearTrapLegDamage: 40
  # Скільки міцності ніг відновлюється за секунду поза пасткою (0…20).
  legIntegrityRegenPerSecond: 0.5
  # Скільки разів звучить боротьба в капкані, 0 — тиша (0…64).
  bearTrapStruggleRepeats: 3

  # ── Міні-гра визволення з капкана ──────────────────────────────────
  # Скільки тіків жертва бачить підказку «натисни F» до початку (20…1200).
  trapEscapePromptTicks: 300
  # Скільки тіків дано на саму спробу (20…1200).
  trapEscapeTicks: 300
  # Скільки влучань треба (1…20).
  trapEscapeHitsRequired: 5
  # Скільки влучань знімає промах, 0 — без штрафу (0…10).
  trapEscapeMissPenalty: 2
  # Швидкість повзунка, часток смуги за секунду (0.05…5).
  trapEscapeCursorSpeed: 0.9
  # Ширина зони влучання, частка смуги (0.01…0.5).
  trapEscapeHitZoneWidth: 0.1

  # ── Електричний дріт ────────────────────────────────────────────────
  # Перезарядка (20…12000). 1200 = 60 с.
  electricWirePlaceCooldownTicks: 1200
  # Макс. довжина між двома точками (1…8 блоків).
  electricWireMaxLengthBlocks: 4.0
  # Скільки тіків діє удар струмом (20…2400). 300 = 15 с.
  electricWireShockTicks: 300
  # Шкода за секунду дії, хп (0…20).
  electricWireDamagePerSecond: 1
  # Тряска камери: амплітуда в градусах (0…15) і частота в Гц (0.5…30).
  electricWireShakeDegrees: 2.5
  electricWireShakeHz: 9.0

  # ── Мотузка (підвіс) ────────────────────────────────────────────────
  # Перезарядка (20…12000). 1000 = 50 с.
  ropeTrapPlaceCooldownTicks: 1000
  # Вільних блоків між підлогою й стелею: мінімум (2…8) і максимум (3…12).
  ropeTrapMinCeilingBlocks: 3
  ropeTrapMaxCeilingBlocks: 6
  # Розкачування A/D, щоб порвати нитку:
  #   сила одного натискання (0.005…0.2);
  ropeSwingKick: 0.032
  #   згасання за тік, 0.02 = 2% (0.001…0.2);
  ropeSwingDamping: 0.02
  #   жорсткість маятника — більше, швидше гойдається (0.01…0.2);
  ropeSwingFrequency: 0.05
  #   кут, за якого нитка рветься, у градусах (10…80);
  ropeSwingBreakDegrees: 45.0
  #   мін. інтервал між зарахованими натисканнями, тіків (2…30). Швидше —
  #   промах, тож спам марний.
  ropeSwingPressIntervalTicks: 8

  # ── Лом: удар по капкану ────────────────────────────────────────────
  # Скільки % міцності втрачає лом за удар (1…100).
  crowbarHitWearPercent: 33
  # Перезарядка між ударами (0…12000). 400 = 20 с.
  crowbarCooldownTicks: 400
  # Дальність (1…8 блоків).
  crowbarRangeBlocks: 3.5

  # ── Лом: удар по маньяку (оглушення) ────────────────────────────────
  # Тривалість оглушення (160…600 тіків). Мінімум 8 с за дизайном.
  crowbarStunDurationTicks: 160
  # Перезарядка між ударами (0…12000). 600 = 30 с.
  crowbarStunCooldownTicks: 600
  # Дальність (1…8 блоків).
  crowbarStunRangeBlocks: 3.5
  # Знос лома за удар, % (1…100).
  crowbarStunHitWearPercent: 25
  # Рівень нудоти: 0 = I (0…4).
  crowbarStunNauseaAmplifier: 0

  # ── Біта: удар по маньяку (оглушення) ───────────────────────────────
  # Працює лише по маньяку, не по капканах.
  # Тривалість оглушення (160…600 тіків). 240 = 12 с.
  batStunDurationTicks: 240
  # Перезарядка між ударами (0…12000). 600 = 30 с.
  batStunCooldownTicks: 600
  # Дальність (1…8 блоків).
  batStunRangeBlocks: 3.5
  # Знос біти за удар, % (1…100). 50 — ламається з двох ударів.
  batStunHitWearPercent: 50
