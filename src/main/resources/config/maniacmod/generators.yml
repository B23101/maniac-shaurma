# ═══════════════════════════════════════════════════════════════════════
#  ГЕНЕРАТОРИ
# ═══════════════════════════════════════════════════════════════════════
#  Час: 20 тіків = 1 секунда. Відстані — у блоках.
#  Стадії генератора: бензин (FUEL) і ремонт (REPAIR), порядок — нижче.
# ═══════════════════════════════════════════════════════════════════════

# ── Скільки генераторів і як вони розставлені ──────────────────────────
# Скільки генераторів треба полагодити, щоб відкрити вихід (1…32).
generatorsRequired: 6
# Зайві «відволікаючі» генератори на кожного маньяка понад потрібні
# (0…8). Проти кемпінгу: лагодити треба рівно generatorsRequired.
bonusGeneratorsPerManiac: 1
# Мін. відстань між двома генераторами (0…1024).
minGeneratorToGeneratorBlocks: 40
# Мін. відстань від генератора до старту маньяка (0…1024).
minGeneratorToManiacBlocks: 40

# ── Порядок і швидкість стадій ──────────────────────────────────────────
# Який етап іде першим: FUEL_THEN_REPAIR або REPAIR_THEN_FUEL.
stageOrder: FUEL_THEN_REPAIR
# Скільки % палива треба залити (100…500).
fuelRequiredPercent: 200
# Темп заливки: % палива за секунду (1…200). Стільки ж списується з
# каністри: 100% каністра порожніє за 25 с.
fuelPercentPerSecond: 4
# Скільки секунд утримання ПКМ потрібно на весь ремонт (1…600).
repairSecondsPerStage: 90

# ── Дальність і кут ремонту ────────────────────────────────────────────
# Макс. відстань від гравця до генератора (1…16 блоків).
repairMaxDistanceBlocks: 5.0
# Макс. кут між поглядом і генератором (10…180°). 180 — вимкнути.
repairMaxLookAngleDegrees: 60

# ── Міні-ігри: коли вони випадають ──────────────────────────────────────
# Шанс за тік ремонту, що випаде міні-гра (0…1).
minigameTriggerChancePerTick: 0.0015
# Скільки тіків від початку ремонту міні-гра точно не випаде (0…1200).
minigameGraceTicks: 60
# Пауза після міні-гри до наступної (0…1200 тіків).
minigameCooldownTicks: 100
# true — поки йде міні-гра, ремонт стоїть для ВСІХ на цьому генераторі.
minigameBlocksRepair: true

# ── Міні-гра «ціль» (повзунок) ───────────────────────────────────────────
# Скільки влучань треба (1…10). Промах — одразу провал.
targetMinigameHitsRequired: 3
# Швидкість повзунка, часток смуги за секунду (0.05…5).
targetMinigameCursorSpeed: 0.7
# Ширина зони влучання, частка смуги (0.01…0.5).
targetMinigameHitZoneWidth: 0.08
# Допуск на затримку мережі при перевірці кліку (50…2000 мс).
targetMinigameLagToleranceMs: 400

# ── Міні-гра «дроти» ────────────────────────────────────────────────────
# Ліміт часу на всі 4 дроти разом (20…1200 тіків). 200 = 10 с.
wireMinigameTicks: 200

# ── Провал міні-гри (вибух генератора) ──────────────────────────────────
# Скільки % ремонту знімає провал (0…100). Бензин не чіпає.
minigameFailLossPercent: 10
# Скільки триває вибух: світіння, вогонь, червоний маркер (20…600 тіків).
failFlashTicks: 100
# Скільки тіків підсвічується генератор (20…600).
highlightDurationTicks: 100

# ── Викрутка ────────────────────────────────────────────────────────────
# Бонус до швидкості ремонту: множник = 1 + бонус (0…5).
screwdriverSpeedBonus: 1.0
# Скільки % міцності викрутка втрачає за секунду роботи (0…100).
screwdriverWearPercentPerSecond: 5
# Наскільки викрутка зменшує шанс міні-ігор (0…1).
screwdriverMinigameReduction: 0.25
