# ═══════════════════════════════════════════════════════════════════════
#  БАРИКАДИ (закриті зони)
# ═══════════════════════════════════════════════════════════════════════
#  Дошки, які виживі ламають ломом: ПКМ ломом по барикаді відкриває міні-гру — треба затиснути ЛКМ
#  на кожному цвяху (2 цвяхи на дошку), і коли зняті всі дошки, барикада розвалюється.
#  Лом втрачає міцність за кожен витягнутий цвях (а не за всю барикаду).
#  Розмітка (де що стоїть) — командами /maniac barricade ... (файл barricade_layout.yml):
#    /maniac barricade door      — зареєструвати блок-дошки (maniacmod:boards), на який дивишся
#    /maniac barricade build     — режим будування гнучкої барикади (ПКМ — точка, Shift+ПКМ — прибрати)
#    /maniac barricade create    — зареєструвати все, що побудовано (без прицілювання)
# ═══════════════════════════════════════════════════════════════════════

# Скільки відсотків міцності лом втрачає за ОДИН витягнутий цвях (1…100).
# Двері — 16 цвяхів: при 2% це 32% на двері (лома вистачає приблизно на три двері).
crowbarWearPerNailPercent: 2
# З якої відстані виживий дістає ломом до барикади, блоки (1…8).
crowbarRangeBlocks: 4.5
# Найдовша дошка гнучкої барикади, блоки (0.5…16).
maxBoardLengthBlocks: 6.0
# Скільки дощок максимум у одній гнучкій барикаді (1…128).
maxBoardsPerBarricade: 24

# Скільки тіків утримувати ЛКМ на ОДНОМУ цвяху, щоб витягти його (5…600; 20 тіків = 1 с).
# Цвяхів у барикаді вдвічі більше, ніж дощок — повний час = цвяхи × це число.
nailPullTicks: 30
# Бонус швидкості від серцебиття (страху): швидкість = 1 + бонус × серцебиття (0…4).
# 1.0 — біля самого маньяка цвяхи виходять удвічі швидше; 0 — серцебиття не впливає.
heartbeatSpeedBonus: 1.0
