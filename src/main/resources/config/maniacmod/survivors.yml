# ═══════════════════════════════════════════════════════════════════════
#  ВИЖИВІ
# ═══════════════════════════════════════════════════════════════════════
#  Час: 20 тіків = 1 секунда. Відстані — у блоках.
# ═══════════════════════════════════════════════════════════════════════

# ── Основне ─────────────────────────────────────────────────────────────
# Максимум здоров'я (1…1000).
maxHp: 100
# Слотів хотбару в виживого (1…9).
inventorySlots: 4
# Перезарядка ліхтарика, тіків (20…6000). 600 = 30 с.
flashlightCooldownTicks: 600

# ── Стаміна ─────────────────────────────────────────────────────────────
# Скільки стаміни (частка 0…1) витрачається за тік бігу.
staminaDrainPerTick: 0.008
# Скільки стаміни відновлюється за тік відпочинку.
staminaRegenPerTick: 0.004

# ── Непритомність і порятунок ──────────────────────────────────────────
# Скільки тіків непритомний живе без допомоги, перш ніж помре
# (100…36000). 1200 = 60 с. Час стоїть, поки гравець офлайн.
downedBleedOutTicks: 1200
# Швидкість повзання непритомного — частка від звичайної (0…1).
downedCrawlSpeed: 0.15
# Скільки тіків утримувати ПКМ на непритомному, щоб підняти його одним
# рятівником (20…6000). 160 = 8 с.
rescueTicks: 160
# За скільки тіків повний прогрес підняття згасає до нуля, коли його
# ніхто не тримає (1…6000). 100 = 5 с.
rescueDecayTicks: 100
# З якої відстані можна піднімати (1…8 блоків).
rescueRangeBlocks: 3.5
# Бонус до швидкості підняття за кожного додаткового помічника (0…1).
rescueHelperBonus: 0.2
# Скільки хп має гравець одразу після підняття (1…1000).
reviveHp: 10
# Радіус (0…64 блоки), у якому поруч з непритомним стоїть таймер його
# смерті, поки там маньяк: добити лежачого можна лише перечекавши.
maniacMercyRadiusBlocks: 15

# ── Падіння ─────────────────────────────────────────────────────────────
# З якої висоти гравець падає непритомним (2…64 блоки).
fallKnockdownHeightBlocks: 4
# З якої висоти ноги починають зношуватись (1…64 блоки). Діє й нижче
# порога нокдауну.
fallLegWearMinHeightBlocks: 2
# Скільки прихованої міцності ніг (0…100) знімає кожен блок висоти.
fallLegWearPerBlock: 8.0

# Перелом ноги: шанс росте лінійно між двома висотами.
# Мінімальна висота, з якої нога МОЖЕ зламатись (2…64).
legBreakMinHeightBlocks: 6
# Шанс перелому на мінімальній висоті (0…1).
legBreakChanceAtMinHeight: 0.2
# Висота, з якої шанс уже максимальний (2…64).
legBreakMaxHeightBlocks: 10
# Шанс перелому на максимальній висоті й вище (0…1).
legBreakChanceAtMaxHeight: 0.9

# Вставання після падіння (стан CRAWLING): спамити пробіл.
# Скільки натискань треба (1…200).
standUpPresses: 25
# За скільки тіків прогрес вставання згасає до нуля без натискань
# (1…6000). 80 = 4 с. Менше — треба тиснути частіше.
standUpDecayTicks: 80

# ── Маньяк і напруга ──────────────────────────────────────────────────
# Відстань, з якої чути серцебиття біля маньяка (0…128 блоків).
heartbeatRangeBlocks: 12
# Скільки тіків тримається швидкість після удару маньяка (0…6000).
# 100 = 5 с. Стаміна при ударі відновлюється повністю.
maniacHitSpeedTicks: 100

# ── Адреналін (предмет) ────────────────────────────────────────────────
# Скільки тіків діє: швидший біг, стаміна не витрачається (20…6000).
adrenalineDurationTicks: 200
# Рівень ефекту швидкості: 0 = Speed I, 1 = Speed II (0…5).
adrenalineSpeedAmplifier: 1
# «Відкат» після: стільки тіків стаміна тримається на нулі (0…6000).
adrenalineCrashTicks: 100
