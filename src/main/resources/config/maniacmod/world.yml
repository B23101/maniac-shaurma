# ═══════════════════════════════════════════════════════════════════════
#  СВІТ: ЧАС ДОБИ І ПОГОДА
# ═══════════════════════════════════════════════════════════════════════
world:

  # ── Час доби ───────────────────────────────────────────────────────
  # Час Minecraft у тіках (0…23999): 6000 — день, 18000 — ніч.
  gameTimeTicks: 18000
  # true — час утримується в КОЖНІЙ фазі (і в лобі, і в грі).
  maintainGameTime: true

  # ── Погода (лише в ігрових фазах) ──────────────────────────────────
  # У лобі дощу й грози немає взагалі — це правило режиму, не опція.
  weatherEventsEnabled: true
  # Шанс, що в момент перевірки почнеться погодна подія (0…1).
  weatherEventChance: 0.2
  # Яку частку матчу максимум займає погода (0…1).
  weatherTargetShare: 0.2

  # Інтервал між подіями — випадковий у цих межах (секунди).
  # 300 с = 5 хв, 900 с = 15 хв.
  weatherMinIntervalSeconds: 300
  weatherMaxIntervalSeconds: 900

  # Тривалість однієї події — випадкова в межах (секунди).
  # 120 с = 2 хв, 300 с = 5 хв.
  weatherMinDurationSeconds: 120
  weatherMaxDurationSeconds: 300

  # Шанс, що подія виявиться грозою, а не дощем (0…1).
  weatherThunderChance: 0.35
