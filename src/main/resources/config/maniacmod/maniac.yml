# Головний конфіг режиму. Другорядні налаштування лежать у своїх файлах:
# survivors.yml, maniacs.yml, generators.yml, points.yml, world.yml, inventory.yml.
game:
  # Скільки гравців потрібно, щоб стартувати матч.
  minPlayers: 2

  # Тривалості технічних фаз (секунди).
  # Тривалості CINEMATIC тут НЕМАЄ навмисно: кінематики ще не існує, тому
  # фаза пропускається ПРОПУСКОМ У КОДІ — вона живе один тік, за який
  # готується план розкидання, і матч одразу йде SCATTER → ROLE_REVEAL →
  # HUNT. Старт моментальний, разом з розподілом гравців, генераторів і
  # точок луту. Коли кінематика з'явиться — сюди повернеться ключ із
  # тривалістю, а в коді — очікування замість пропуску.
  roleRevealSeconds: 5
  endingSeconds: 10

  # ── Дебаг-режим для одиночних перевірок ──────────────────────────────
  # true — матч можна почати ОДНИМ гравцем (/maniac start), і він не
  # завершується, коли з будь-якого боку лишається 0 гравців (0 виживих
  # або 0 маньяків). Також у дебазі нема карти — план розкидання не
  # ламає старт, матч просто йде без телепорту й без генераторів.
  # НЕ вмикати на живому сервері.
  debugMode: false

  # Ким буде єдиний гравець у дебазі:
  #   AUTO     — звичайний вибір маньяка (як у конфігу maniacs.yml);
  #   MANIAC   — ти маньяк (виконавець /maniac start), виживих немає;
  #   SURVIVOR — ти виживий, маньяка немає взагалі (слоти, стаміна,
  #              генератори, лут — усе, що не залежить від маньяка).
  debugRole: MANIAC
