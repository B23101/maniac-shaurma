# ══════════════════════════════════════════════════════════════════════
#  maniac.yml — конфіг режиму «Маньяк»
#
#  Файл живе в <світ>/maniacmod/maniac.yml і читається наживо:
#  збережи зміни — вони діють одразу, рестарт не потрібен.
#  Примусово: /maniac reload
#
#  Якщо після оновлення мода з'явиться новий БЛОК — він допишеться в
#  кінець цього файлу автоматично. Вміст блоків, що вже є, не чіпається
#  ніколи: видалене з них лишається видаленим.
# ══════════════════════════════════════════════════════════════════════

# Тривалості технічних фаз і мінімум гравців.
match:
  minPlayers: 2              # 2…32
  cinematicSeconds: 20       # 0…300, 0 = пропустити вступ
  roleRevealSeconds: 5       # 1…60
  endingSeconds: 10          # 1…120

# Розмір карти й правила розкидання гравців.
map:
  sizeBlocks: 300                    # 64…2048
  minSurvivorToManiacBlocks: 60      # 0…1024
  minSurvivorToPeerBlocks: 20        # 0…1024
  itemPointEngageRatio: 0.6          # 0.0…1.0 — частка задіяних точок луту
  relaxationStep: 0.85               # 0.1…0.99 — на скільки слабшають дистанції за прохід
  maxRelaxationPasses: 6             # 0…32

# Ремонт, бензин і підсвітка генераторів.
generators:
  generatorsRequired: 5        # 1…32 — скільки треба завершити, щоб відкрились виходи
  minigamesPerGenerator: 5     # 1…20
  minigameFailChance: 0.15     # 0.0…1.0
  minigameTicks: 200           # 20…1200 (200 = 10 с)
  fuelRequiredPercent: 200     # 100…500
  fuelPerCanister: 100         # 10…500
  highlightDurationTicks: 100  # 20…600 (100 = 5 с)
  failFlashTicks: 60           # 0…600 — скільки червона підсвітка видна маньяку

# Здоров'я, стаміна, падіння, підняття непритомних.
survivors:
  maxHp: 100                      # 1…1000
  inventorySlots: 4               # 1…9
  flashlightCooldownTicks: 600    # 20…6000 (600 = 30 с)
  rescueTicks: 300                # 20…6000 (300 = 15 с)
  rescueHelperBonus: 0.2          # 0.0…1.0 — приріст за кожного зайвого рятівника
  staminaDrainPerTick: 0.008      # 0.0…1.0
  staminaRegenPerTick: 0.004      # 0.0…1.0
  fallKnockdownHeightBlocks: 4    # 2…64
  legBreakChance: 0.35            # 0.0…1.0
  heartbeatRangeBlocks: 24        # 0…128, 0 = вимкнути серцебиття

# Базові параметри маньяка. Архетип може перевизначити їх для себе.
maniac:
  attackRangeBlocks: 3.5              # 1.0…8.0
  attackCooldownTicks: 120            # 10…600 (120 = 6 с)
  attackDamage: 50                    # 1…1000
  trapPlaceCooldownTicks: 500         # 20…6000 (500 = 25 с)
  trapMinDistanceToPlayerBlocks: 3    # 0…32

# Хто стає маньяком і як обирається персонаж.
maniac_selection:
  playerMode: RANDOM            # RANDOM | MANUAL
  typeMode: RANDOM              # RANDOM | MENU | FIXED
  fixedManiacId: ''             # id з реєстру маньяків; порожньо = випадковий
  selectionTimeoutSeconds: 60   # 5…300
  enableIntroScene: true

# Предмети, що лежать на карті.
loot:
  pickupRangeBlocks: 2.0   # 0.5…6.0
  fallMaxTicks: 200        # 20…1200 — запобіжник, якщо предмет падає в порожнечу

# Розмітка точок. Наповнюється командою /maniac point add.
# Вміст ніколи не відновлюється з дефолту — видалена точка лишається видаленою.
spawn_points:
  points: []

# Зони карти. Наповнюються командами.
# Вміст ніколи не відновлюється з дефолту.
zones:
  escape: []
  loot: []
