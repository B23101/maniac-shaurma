# ═══════════════════════════════════════════════════════════════════════
#  ГОЛОВНИЙ КОНФІГ РЕЖИМУ
# ═══════════════════════════════════════════════════════════════════════
#  Решта налаштувань лежить у своїх файлах:
#    survivors.yml  — виживі          maniacs.yml    — маньяки й пастки
#    generators.yml — генератори      world.yml      — час доби й погода
#    points.yml     — карта, лут, точки   inventory.yml — хотбар
#    voice.yml      — голос маньяка   darkzones.yml  — темні зони
#
#  Час: 20 тіків = 1 секунда. Зміни з цього файлу підхоплюються самі
#  (раз на секунду), перезапуск сервера не потрібен.
# ═══════════════════════════════════════════════════════════════════════
game:

  # ── Старт матчу ────────────────────────────────────────────────────
  # Скільки гравців потрібно, щоб стартувати матч (2…32).
  minPlayers: 2

  # ── Тривалості фаз (секунди) ───────────────────────────────────────
  # Показ ролей перед початком (1…60).
  roleRevealSeconds: 5
  # Екран завершення матчу перед поверненням у лобі (1…120).
  endingSeconds: 10

  # ── Кіно-вступ (фаза CINEMATIC) ────────────────────────────────────
  # Екран темніє, летить Replay-камера (ролики з replays.yml, точки
  # ставляться командами /maniac replay ...) і показується loader з
  # порадами; потім гравців розкидає по карті, і екран розтемнюється.
  # false — старт миттєвий, без вступу.
  introEnabled: true
  # Скільки секунд летить камера й показується loader (3…60). Далі
  # Replay ВСЕ ОДНО обривається — навіть посеред руху.
  introReplaySeconds: 10
  # Як часто на loader-екрані змінюється порада (2…30 с).
  introTipSeconds: 5

  # ── Дебаг для одиночних перевірок ──────────────────────────────────
  # НЕ вмикати на живому сервері!
  # true — матч можна почати ОДНИМ гравцем (/maniac start) і він не
  # завершується, коли не лишається виживих чи маньяків. Карти в дебазі
  # немає: матч іде без телепорту й без генераторів.
  debugMode: false
  # Ким буде єдиний гравець у дебазі:
  #   AUTO     — звичайний вибір маньяка (як у maniacs.yml);
  #   MANIAC   — ти маньяк (виконавець /maniac start), виживих немає;
  #   SURVIVOR — ти виживий, маньяка немає (слоти, стаміна, генератори,
  #              лут — усе, що не залежить від маньяка).
  debugRole: MANIAC
