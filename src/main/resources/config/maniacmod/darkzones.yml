# ═══════════════════════════════════════════════════════════════════════
#  ТЕМНІ ЗОНИ
# ═══════════════════════════════════════════════════════════════════════
# Самі зони розмічаються командами /maniac darkzone (файл zones.yml).
# Тут — лише сила ефекту, спільна для всіх зон карти.

# Наскільки темнішає освітлення всередині зони (0…3):
#   0 — без змін, 0.55 — помітно темніше, але орієнтуватись можна,
#   1 і більше — майже повна темрява.
intensity: 0.55

# За скільки тіків затемнення плавно доїжджає до цільового рівня при
# вході в зону (і назад при виході), 0…200. 20 тіків = 1 с.
transitionTicks: 20
