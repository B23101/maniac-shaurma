# ═══════════════════════════════════════════════════════════════════════
#  ГОЛОС МАНЬЯКА (Simple Voice Chat)
# ═══════════════════════════════════════════════════════════════════════
# Ефектом керує гра за роллю й фазою матчу — у гравців налаштувань
# голосу немає.

# Увімкнути зміну голосу маньяка.
enabled: true

# Пресет голосу:
#   DEMON  — «одержимий»;
#   TITAN  — «велетень у залі»;
#   BATMAN — «на октаву нижче, тісна кімната».
profile: DEMON

# Сила ефекту (0…100): 0 — голос майже не змінюється, 100 — повний
# пресет. Проміжні значення плавно інтерполюються.
strength: 100
