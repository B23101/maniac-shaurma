pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'maniac'

def localShaurmaLib = file('../shaurma-lib')
if (localShaurmaLib.isDirectory()) {
    includeBuild(localShaurmaLib) {
        dependencySubstitution {
            substitute module('dev.shaurmalib:shaurma-lib-forge') using project(':lib-forge')
        }
    }
}
