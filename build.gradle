plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '3.0.0'
group = 'com.log_to_kot'
archivesBaseName = 'maniacmod'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    // Локальна перевірка змін у shaurma-lib без публікації:
    //   (у shaurma-lib)  ./gradlew publishToMavenLocal
    //   (тут)            ./gradlew compileJava -PuseLocalLib=true
    // Без прапорця поведінка не змінюється — береться як і раніше
    // опублікований артефакт із GitHub Packages.
    if (findProperty('useLocalLib') == 'true') {
        mavenLocal()
    }
    mavenCentral()
    // Локальний jar Simple Voice Chat (libs/voicechat-forge-1.20.1.jar) — потрібен для компіляції
    // кастомних голосових меню (client/screen/voice). Див. README-PATCH.md.
    flatDir { dirs 'libs' }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url = 'https://maven.kosmx.dev/' }
    // Simple Voice Chat API — потрібен ЛИШЕ для компіляції голосового шару
    // (див. пакет voice/). У рантаймі SVC у гравця може не бути взагалі.
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
    maven {
        name = 'GitHubPackagesShaurmaLib'
        url = uri('https://maven.pkg.github.com/B23101/shaurma-lib')
        credentials {
            username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
            password = findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
        }
    }
}

configurations.all {
    resolutionStrategy {
        cacheChangingModulesFor 0, 'seconds'
    }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            arg "-mixin.config=maniacmod.mixins.json"
            arg "-mixin.config=maniacmod.browse.mixins.json"
            arg "-mixin.config=maniacmod.menu.mixins.json"
            mods { maniacmod { source sourceSets.main } }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            arg "-mixin.config=maniacmod.mixins.json"
            arg "-mixin.config=maniacmod.browse.mixins.json"
            arg "-mixin.config=maniacmod.menu.mixins.json"
            mods { maniacmod { source sourceSets.main } }
        }
    }
}

mixin {
    add sourceSets.main, 'maniacmod.refmap.json'
    config 'maniacmod.mixins.json'
    config 'maniacmod.browse.mixins.json'
    config 'maniacmod.menu.mixins.json'
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.4.4')
    implementation fg.deobf('dev.kosmx.player-anim:player-animation-lib-forge:1.0.2-rc1+1.20')
    jarJar(implementation('dev.shaurmalib:shaurma-lib-forge:0.1.0-SNAPSHOT')) {
        jarJar.ranged(it, '[0.1.0,0.2.0)')
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // ── Голосовий чат (Simple Voice Chat) ────────────────────────────────
    // Принципово compileOnly, не implementation/jarJar:
    //   • не всі гравці зобов'язані мати SVC — мод не повинен падати з
    //     ClassNotFoundException, якщо його немає;
    //   • SVC-плагіни реєструються через META-INF/services, тож якщо SVC
    //     відсутній — ніхто не читає цей файл і нічого не завантажується.
    // Версія 2.5.0 — та, що реально сумісна з Forge 1.20.1 (перевірено
    // проти api-джерел у репозиторії: HudIconRenderEvent у ній немає,
    // тому приховування оверлею робиться інакше — див. voice/README.md).
    compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.5.0'

    // Повний SVC (не лише API) — для кастомних голосових меню (client/screen/voice/SvcBridge).
    // Файл кладеться в libs/ під ім'ям voicechat-forge-1.20.1.jar (це ТОЙ САМИЙ jar, що ви ставите в mods/).
    // compileOnly — як і API: у релізі SVC НЕ вбудовується, мод працює й без нього (меню просто штатні).
    compileOnly fg.deobf('local:voicechat-forge:1.20.1')
    // Лише для runClient у середовищі розробки, щоб меню можна було побачити. У jar мода не потрапляє.
    runtimeOnly fg.deobf('local:voicechat-forge:1.20.1')

    // ── Тести ────────────────────────────────────────────────────────────
    // DSP-ланцюжок голосу маньяка — чиста Java без Minecraft, тому він
    // покривається звичайними JUnit-тестами без запуску гри.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

// Тести голосового DSP (src/test) лишаються в проєкті й перевіряються
// компіляцією, але НЕ запускаються автоматично: стандартний test-воркер
// ForgeGradle не бачить власних тест-класів, тож `build` падав би на
// багу інструментарію, а не на коді. Логіку ланцюжка перевірено окремо.
tasks.named('test') {
    enabled = false
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : 'maniacmod',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'MixinConfigs'          : 'maniacmod.mixins.json,maniacmod.browse.mixins.json,maniacmod.menu.mixins.json'
        ])
    }
}

